name: POS Launch Ticket and Options Fix

on:
  push:
    paths:
      - '.deploy/pos-launch-ticket-options-request.txt'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch POS display tickets and item choices
        run: |
          python3 <<'PY'
          from pathlib import Path

          pos = Path('server/routes/pos.ts')
          s = pos.read_text()

          old = 'function ticketNumber(sequence: number) {\n  return String(sequence).padStart(3, "0");\n}\n'
          new = '// Customer-facing ticket numbers are deliberately short for kitchen/display/speaker use.\n// ordering_orders.id remains the permanent globally unique order identifier.\n// Display tickets may repeat after the configured cycle and are never database identities.\nconst DISPLAY_TICKET_MAX = 999;\nconst DISPLAY_TICKET_DIGITS = 3;\nlet displayTicketSchemaReady: Promise<unknown> | null = null;\n\nfunction ticketNumber(sequence: number) {\n  return String(sequence).padStart(DISPLAY_TICKET_DIGITS, "0");\n}\n\nfunction ensureDisplayTicketSchema() {\n  if (!displayTicketSchemaReady) {\n    displayTicketSchemaReady = db().query(\n      `ALTER TABLE ordering_orders DROP CONSTRAINT IF EXISTS ordering_orders_ticket_number_unique`,\n    );\n  }\n  return displayTicketSchemaReady;\n}\n'
          if old not in s:
              raise RuntimeError('ticketNumber block not found')
          s = s.replace(old, new, 1)

          old = '    const bounds = shiftBounds();\n    const result = await db().query(\n      `SELECT COUNT(*) + 1 AS next_ticket\n       FROM ordering_orders\n       WHERE channel IN (\'pos_direct\',\'grab\')\n         AND created_at >= $1 AND created_at < $2`,\n      [bounds.start.toJSDate(), bounds.end.toJSDate()],\n    );'
          new = '    await ensureDisplayTicketSchema();\n    const result = await db().query(\n      `SELECT (COUNT(*) % $1::int) + 1 AS next_ticket\n       FROM ordering_orders\n       WHERE channel IN (\'pos_direct\',\'grab\')`,\n      [DISPLAY_TICKET_MAX],\n    );'
          if old not in s:
              raise RuntimeError('next ticket query not found')
          s = s.replace(old, new, 1)

          old = '  const client = await db().connect();\n  try {\n    await client.query("BEGIN");\n    const openShiftResult = await client.query(`SELECT id FROM public.pos_shifts WHERE status=\'open\' ORDER BY opened_at DESC LIMIT 1 FOR SHARE`);'
          new = '  await ensureDisplayTicketSchema();\n  const client = await db().connect();\n  try {\n    await client.query("BEGIN");\n    const openShiftResult = await client.query(`SELECT id FROM public.pos_shifts WHERE status=\'open\' ORDER BY opened_at DESC LIMIT 1 FOR SHARE`);'
          if old not in s:
              raise RuntimeError('POS order transaction start not found')
          s = s.replace(old, new, 1)

          old = '    await client.query("SELECT pg_advisory_xact_lock(hashtext(\'sbb-pos-ticket-number\'))");\n    const bounds = shiftBounds();\n    const ticketSequenceResult = await client.query(\n      `SELECT COUNT(*) + 1 AS next_ticket FROM ordering_orders WHERE channel IN (\'pos_direct\',\'grab\') AND created_at >= $1 AND created_at < $2`,\n      [bounds.start.toJSDate(), bounds.end.toJSDate()],\n    );'
          new = '    await client.query("SELECT pg_advisory_xact_lock(hashtext(\'customli-pos-display-ticket\'))");\n    const ticketSequenceResult = await client.query(\n      `SELECT (COUNT(*) % $1::int) + 1 AS next_ticket FROM ordering_orders WHERE channel IN (\'pos_direct\',\'grab\')`,\n      [DISPLAY_TICKET_MAX],\n    );'
          if old not in s:
              raise RuntimeError('POS order ticket sequence not found')
          s = s.replace(old, new, 1)
          pos.write_text(s)

          modifier = Path('server/services/menu/modifierService.ts')
          m = modifier.read_text()
          old = '         VALUES($1,$2,NULL,1,1,TRUE,$3,\'choice\',\'single\',1,1,$4,TRUE)\n         RETURNING id`,\n        [name, String(data?.name_th ?? "").trim() || null, Number(data?.sortOrder ?? 0), promptText],'
          new = '         VALUES($1,$2,$3,1,1,TRUE,$4,\'choice\',\'single\',1,1,$5,TRUE)\n         RETURNING id`,\n        [name, String(data?.name_th ?? "").trim() || null, itemId, Number(data?.sortOrder ?? 0), promptText],'
          if old not in m:
              raise RuntimeError('item choice insert not found')
          m = m.replace(old, new, 1)
          modifier.write_text(m)
          PY

          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build

      - name: Commit launch fixes and request production deploy
        run: |
          git config user.name "SBB Launch Bot"
          git config user.email "actions@smashbrosburgers.com"
          printf 'SBB production deployment request\nrequested_at=%s\nrequested_by=POS Launch Bot\nref=main\nreason=Fix display ticket uniqueness and item choice save\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/sbb-production-request.txt
          git add server/routes/pos.ts server/services/menu/modifierService.ts .deploy/sbb-production-request.txt
          git commit -m "Fix POS ticket collisions and item choice saves"
          git push origin HEAD:main
