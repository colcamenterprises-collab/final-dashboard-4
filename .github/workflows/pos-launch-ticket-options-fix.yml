name: POS Launch Ticket Hotfix

on:
  push:
    paths:
      - '.deploy/pos-launch-ticket-options-request.txt'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch fast display ticket generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/routes/pos.ts')
          s = p.read_text()
          old = """function ensureDisplayTicketSchema() {
  if (!displayTicketSchemaReady) {
    displayTicketSchemaReady = db().query(
      `ALTER TABLE ordering_orders DROP CONSTRAINT IF EXISTS ordering_orders_ticket_number_unique`,
    );
  }
  return displayTicketSchemaReady;
}"""
          new = """function ensureDisplayTicketSchema() {
  if (!displayTicketSchemaReady) {
    displayTicketSchemaReady = (async () => {
      await db().query(`DROP INDEX IF EXISTS ordering_orders_ticket_number_unique`);
      await db().query(`CREATE SEQUENCE IF NOT EXISTS ordering_display_ticket_seq START 1`);
    })();
  }
  return displayTicketSchemaReady;
}"""
          if old not in s:
              raise RuntimeError('display ticket schema block not found')
          s = s.replace(old, new, 1)
          old = """    const result = await db().query(
      `SELECT (COUNT(*) % $1::int) + 1 AS next_ticket
       FROM ordering_orders
       WHERE channel IN ('pos_direct','grab')`,
      [DISPLAY_TICKET_MAX],
    );
    const next = Number(result.rows[0]?.next_ticket || 1);"""
          new = """    const result = await db().query(
      `SELECT ((nextval('ordering_display_ticket_seq') - 1) % $1::bigint) + 1 AS next_ticket`,
      [DISPLAY_TICKET_MAX],
    );
    const next = Number(result.rows[0]?.next_ticket || 1);"""
          if old not in s:
              raise RuntimeError('next-ticket count query not found')
          s = s.replace(old, new, 1)
          old = """    await client.query(\"SELECT pg_advisory_xact_lock(hashtext('customli-pos-display-ticket'))\");
    const ticketSequenceResult = await client.query(
      `SELECT (COUNT(*) % $1::int) + 1 AS next_ticket FROM ordering_orders WHERE channel IN ('pos_direct','grab')`,
      [DISPLAY_TICKET_MAX],
    );"""
          new = """    const ticketSequenceResult = await client.query(
      `SELECT ((nextval('ordering_display_ticket_seq') - 1) % $1::bigint) + 1 AS next_ticket`,
      [DISPLAY_TICKET_MAX],
    );"""
          if old not in s:
              raise RuntimeError('order ticket count query not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
      - name: Commit hotfix
        run: |
          git config user.name "SBB Launch Bot"
          git config user.email "actions@smashbrosburgers.com"
          git add server/routes/pos.ts
          git commit -m "Fix POS ticket index and make ticket generation instant"
          git push origin HEAD:main
