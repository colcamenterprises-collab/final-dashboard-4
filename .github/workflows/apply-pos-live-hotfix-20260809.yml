name: Apply POS live hotfix 20260809

on:
  push:
    branches:
      - fix/pos-live-cart-grab-modifiers-20260809
    paths:
      - .github/workflows/apply-pos-live-hotfix-20260809.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pos-live-cart-grab-modifiers-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted POS hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          register = Path('client/src/pages/pos/PosRegister.tsx')
          text = register.read_text()

          old_import = 'import { useEffect, useMemo, useState } from "react";\n'
          new_import = 'import { useEffect, useMemo, useState } from "react";\nimport { processCreatedPosOrder } from "@/lib/posNativeCheckoutBridge";\n'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_start = '''  const startItem = async (item:Item) => {\n    // Grab selections are handled in Grab. Staff only choose the included drink\n    // when entering an existing meal-deal order into this POS.\n    if (mode === "grab") {\n      if (!isMealDeal(item)) return commitLine({...item,quantity:1});\n      setPending({item,modifiers:[]}); setModifierGroups([]); setFlow("meal-deal"); setSetUpgrade(false); setSelectedDrink(""); return;\n    }\n    if (!item.has_options && !isBurger(item) && !isMealDeal(item)) return commitLine({...item,quantity:1});\n    try {\n      const response = await fetch(`/api/pos/menu/${item.id}/modifiers`,{credentials:"include"});\n      if (response.status === 401) { window.location.assign("/pos?lock=1"); return; }\n      const body = await response.json();\n      if (!response.ok) throw new Error(body.error || "Could not load additions");\n      const groups = (body.groups || []).map((group:ModifierGroup) => ({...group,min_selections:Number(group.min_selections || 0),max_selections:group.max_selections == null ? null : Number(group.max_selections),options:(group.options || []).map((option:Modifier) => ({...option,price_delta:Number(option.price_delta || 0)}))}));\n      if (!groups.length && !isBurger(item) && !isMealDeal(item)) return commitLine({...item,quantity:1});\n      setPending({item,modifiers:[]}); setModifierGroups(groups); setFlow(groups.length ? "options" : isMealDeal(item) ? "meal-deal" : "upgrade"); setSetUpgrade(false); setSelectedDrink(""); setNotice("");\n    } catch (error:any) { setNotice(error.message); }\n  };'''
          new_start = '''  const startItem = async (item:Item) => {\n    if (!item.has_options && !isBurger(item) && !isMealDeal(item)) return commitLine({...item,quantity:1});\n    try {\n      const response = await fetch(`/api/pos/menu/${item.id}/modifiers`,{credentials:"include"});\n      if (response.status === 401) { window.location.assign("/pos?lock=1"); return; }\n      const body = await response.json();\n      if (!response.ok) throw new Error(body.error || "Could not load additions");\n      const groups = (body.groups || []).map((group:ModifierGroup) => ({...group,min_selections:Number(group.min_selections || 0),max_selections:group.max_selections == null ? null : Number(group.max_selections),options:(group.options || []).map((option:Modifier) => ({...option,price_delta:Number(option.price_delta || 0)}))}));\n      if (!groups.length) {\n        if (isMealDeal(item)) {\n          setPending({item,modifiers:[]}); setModifierGroups([]); setFlow("meal-deal"); setSetUpgrade(false); setSelectedDrink(""); setNotice(""); return;\n        }\n        if (mode === "direct" && item.set_upgrade_eligible) {\n          setPending({item,modifiers:[]}); setModifierGroups([]); setFlow("upgrade"); setSetUpgrade(false); setSelectedDrink(""); setNotice(""); return;\n        }\n        return commitLine({...item,quantity:1});\n      }\n      setPending({item,modifiers:[]}); setModifierGroups(groups); setFlow("options"); setSetUpgrade(false); setSelectedDrink(""); setNotice("");\n    } catch (error:any) { setNotice(error.message); }\n  };'''
          assert old_start in text
          text = text.replace(old_start, new_start, 1)

          old_advance = '''    if (isMealDeal(pending.item)) return setFlow("meal-deal");\n    if (pending.item.set_upgrade_eligible) return setFlow("upgrade");\n    finishItem();'''
          new_advance = '''    if (isMealDeal(pending.item)) return setFlow("meal-deal");\n    if (mode === "direct" && pending.item.set_upgrade_eligible) return setFlow("upgrade");\n    finishItem();'''
          assert old_advance in text
          text = text.replace(old_advance, new_advance, 1)

          old_finish = '''    if ((isMealDeal(pending.item) || (pending.item.set_upgrade_eligible && setUpgrade)) && !selectedDrink) return setNotice("Select the included drink before continuing");\n    commitLine({...pending.item,quantity:1,modifiers:pending.modifiers,meal_deal:isMealDeal(pending.item),set_upgrade:pending.item.set_upgrade_eligible ? setUpgrade : false,set_drink_menu_item_id:selectedDrink || undefined});'''
          new_finish = '''    if ((isMealDeal(pending.item) || (mode === "direct" && pending.item.set_upgrade_eligible && setUpgrade)) && !selectedDrink) return setNotice("Select the included drink before continuing");\n    commitLine({...pending.item,quantity:1,modifiers:pending.modifiers,meal_deal:isMealDeal(pending.item),set_upgrade:mode === "direct" && pending.item.set_upgrade_eligible ? setUpgrade : false,set_drink_menu_item_id:selectedDrink || undefined});'''
          assert old_finish in text
          text = text.replace(old_finish, new_finish, 1)

          marker = '''  const optionSelectionError = (groups:ModifierGroup[], modifiers:Modifier[]) => {'''
          controls = '''  const decrementCartLine = (index:number) => setCart(current => current.flatMap((line,i) => i !== index ? [line] : line.quantity > 1 ? [{...line,quantity:line.quantity - 1}] : []));\n  const removeCartLine = (index:number) => setCart(current => current.filter((_,i) => i !== index));\n\n'''
          assert marker in text
          text = text.replace(marker, controls + marker, 1)

          old_line = '''<div className="flex justify-between gap-2 text-sm font-bold"><span className="leading-5">{line.quantity} × {label(line)}</span><span>{thb(lineTotal(line))}</span></div>'''
          new_line = '''<div className="flex items-start justify-between gap-2 text-sm font-bold"><span className="leading-5">{line.quantity} × {label(line)}</span><div className="flex items-center gap-1"><span className="mr-1">{thb(lineTotal(line))}</span><button type="button" aria-label={`Remove one ${label(line)}`} title="Remove one" onClick={()=>decrementCartLine(index)} className="grid h-7 w-7 place-items-center rounded-lg bg-zinc-100 text-base font-black text-zinc-700 hover:bg-zinc-200">−</button><button type="button" aria-label={`Remove ${label(line)} line`} title="Remove line" onClick={()=>removeCartLine(index)} className="grid h-7 w-7 place-items-center rounded-lg bg-red-50 text-xs font-black text-red-600 hover:bg-red-100">×</button></div></div>'''
          assert old_line in text
          text = text.replace(old_line, new_line, 1)

          old_success = '''      setNotice(`${body.data.ticket_number} sent to kitchen`);\n      speakKitchenOrder(kitchenCalloutItems(),language);'''
          new_success = '''      setNotice(`${body.data.ticket_number} sent to kitchen`);\n      if (body.data?.id) void processCreatedPosOrder(String(body.data.id),String(body.data.ticket_number || ""));\n      speakKitchenOrder(kitchenCalloutItems(),language);'''
          assert old_success in text
          text = text.replace(old_success, new_success, 1)
          register.write_text(text)

          pos = Path('server/routes/pos.ts')
          server = pos.read_text()
          reject = '      if (mode === "grab" && modifierIds.length) throw new Error("Grab orders cannot use staff modifiers");\n\n'
          assert reject in server
          server = server.replace(reject, '', 1)

          direct_block = '''      let selectedModifiers: any[] = [];\n      if (mode === "direct") {\n        const groupResult = await client.query('''
          all_modes = '''      let selectedModifiers: any[] = [];\n      {\n        const groupResult = await client.query('''
          assert direct_block in server
          server = server.replace(direct_block, all_modes, 1)
          pos.write_text(server)

          bridge = Path('client/src/lib/posNativeCheckoutBridge.ts')
          b = bridge.read_text()
          flag = 'const BRIDGE_FLAG = "__sbbPosNativeCheckoutBridgeInstalled";\n'
          assert flag in b
          b = b.replace(flag, flag + 'const processedOrderIds = new Set<string>();\n', 1)

          old_handle = '''async function handleCreatedOrder(\n  originalFetch: typeof window.fetch,\n  orderId: string,\n  fallbackTicket: string,\n) {'''
          new_handle = '''async function handleCreatedOrder(\n  originalFetch: typeof window.fetch,\n  orderId: string,\n  fallbackTicket: string,\n) {'''
          assert old_handle in b

          export_marker = '''function requestUrl(input: RequestInfo | URL) {'''
          exported = '''export async function processCreatedPosOrder(orderId: string, fallbackTicket = "") {\n  if (!orderId || processedOrderIds.has(orderId)) return;\n  processedOrderIds.add(orderId);\n  try {\n    await handleCreatedOrder(window.fetch.bind(window), orderId, fallbackTicket);\n  } catch {\n    processedOrderIds.delete(orderId);\n  }\n}\n\n'''
          assert export_marker in b
          b = b.replace(export_marker, exported + export_marker, 1)

          old_schedule = '''          window.setTimeout(() => {\n            void handleCreatedOrder(originalFetch, orderId, ticket);\n          }, 0);'''
          new_schedule = '''          window.setTimeout(() => {\n            void processCreatedPosOrder(orderId, ticket);\n          }, 0);'''
          assert old_schedule in b
          b = b.replace(old_schedule, new_schedule, 1)
          bridge.write_text(b)
          PY

          git diff --check
          git diff -- client/src/pages/pos/PosRegister.tsx server/routes/pos.ts client/src/lib/posNativeCheckoutBridge.ts

      - name: Validate build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/pos/PosRegister.tsx server/routes/pos.ts client/src/lib/posNativeCheckoutBridge.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix live POS cart removal Grab modifiers and shared auto-print"
          git push origin HEAD:fix/pos-live-cart-grab-modifiers-20260809
