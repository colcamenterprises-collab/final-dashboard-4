name: POS Launch Patch Cloud

on:
  push:
    paths:
      - '.github/workflows/pos-launch-patch-cloud.yml'

permissions:
  contents: write

jobs:
  patch-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch launch blockers and POS presentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/pos/PosRegister.tsx')
          s=p.read_text()
          s=s.replace('const [checkoutError,setCheckoutError] = useState("");', 'const [checkoutError,setCheckoutError] = useState("");\n  const [checkoutBusy,setCheckoutBusy] = useState(false);')
          s=s.replace('const charge = async (skipMarketing = false) => {\n    // Marketing is an optional capture, never a checkout gate.  The prompt is\n    // useful for staff, but a completed food order must always reach kitchen.\n    setCheckoutError("");\n    try {', 'const charge = async (skipMarketing = false) => {\n    if (checkoutBusy) return;\n    setCheckoutBusy(true);\n    setCheckoutError("");\n    setNotice("Processing payment…");\n    try {')
          s=s.replace('    } catch (error:any) { setCheckoutError(error.message || "Could not complete the order"); }\n  };', '    } catch (error:any) {\n      const message = error.message || "Could not complete the order";\n      setCheckoutError(message);\n      setNotice(`PAYMENT FAILED — ${message}`);\n    } finally {\n      setCheckoutBusy(false);\n    }\n  };',1)
          s=s.replace('return <main className="h-dvh overflow-hidden bg-[#fffdf4] text-[#171717]">','return <main className="h-dvh overflow-hidden bg-white text-[#171717]">')
          s=s.replace('className="h-[135px] w-full max-w-[220px] bg-transparent object-contain drop-shadow-[0_10px_10px_rgba(39,27,8,0.14)]"','className="h-[135px] w-[135px] bg-transparent object-contain drop-shadow-[0_10px_10px_rgba(39,27,8,0.14)]"')
          s=s.replace('<button disabled={!cart.length} onClick={startCheckout} className="mt-3 w-full rounded-xl bg-[#ffd400] py-4 text-base font-black text-black shadow-[0_7px_0_#d7ae00] transition hover:bg-[#ffe042] active:translate-y-0.5 active:shadow-[0_4px_0_#d7ae00] disabled:cursor-not-allowed disabled:opacity-40">{ui.continue} {thb(total)}</button>', '<button type="button" disabled={!cart.length || checkoutBusy} onClick={startCheckout} className="mt-3 w-full rounded-xl bg-[#ffd400] py-4 text-base font-black text-black shadow-[0_7px_0_#d7ae00] transition hover:bg-[#ffe042] active:translate-y-0.5 active:shadow-[0_4px_0_#d7ae00] disabled:cursor-not-allowed disabled:opacity-40">{checkoutBusy ? "PROCESSING…" : `${ui.continue} ${thb(total)}`}</button>')
          p.write_text(s)

          k=Path('native/android/ThermalPrinterPlugin.kt')
          t=k.read_text()
          t=t.replace('import com.getcapacitor.annotation.CapacitorPlugin\n','import com.getcapacitor.annotation.CapacitorPlugin\nimport com.getcapacitor.annotation.Permission\nimport com.getcapacitor.annotation.PermissionCallback\n')
          t=t.replace('@CapacitorPlugin(name = "ThermalPrinter")','@CapacitorPlugin(\n    name = "ThermalPrinter",\n    permissions = [Permission(alias = "bluetooth", strings = [Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN])]\n)')
          t=t.replace('private fun hasConnectPermission(): Boolean {\n        return Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||\n            ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED\n    }','private fun hasBluetoothPermission(): Boolean {\n        return Build.VERSION.SDK_INT < Build.VERSION_CODES.S || (\n            ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED &&\n            ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED\n        )\n    }')
          t=t.replace('        if (!hasConnectPermission()) {\n            call.reject("Bluetooth permission is required. Allow Nearby devices for Smash Brothers POS.")\n            return null\n        }\n','')
          t=t.replace('    @PluginMethod\n    fun listPrinters(call: PluginCall) {\n        val adapter = requireBluetooth(call) ?: return\n','    @PluginMethod\n    fun listPrinters(call: PluginCall) {\n        if (!hasBluetoothPermission()) {\n            requestPermissionForAlias("bluetooth", call, "bluetoothPermissionCallback")\n            return\n        }\n        listPrintersGranted(call)\n    }\n\n    @PermissionCallback\n    private fun bluetoothPermissionCallback(call: PluginCall) {\n        if (!hasBluetoothPermission()) {\n            call.reject("Nearby devices permission was not granted")\n            return\n        }\n        if (call.methodName == "connect") connectGranted(call) else listPrintersGranted(call)\n    }\n\n    private fun listPrintersGranted(call: PluginCall) {\n        val adapter = requireBluetooth(call) ?: return\n')
          t=t.replace('    @PluginMethod\n    fun connect(call: PluginCall) {\n        val adapter = requireBluetooth(call) ?: return\n        val address = call.getString("address")?.trim()\n','    @PluginMethod\n    fun connect(call: PluginCall) {\n        if (!hasBluetoothPermission()) {\n            requestPermissionForAlias("bluetooth", call, "bluetoothPermissionCallback")\n            return\n        }\n        connectGranted(call)\n    }\n\n    private fun connectGranted(call: PluginCall) {\n        val adapter = requireBluetooth(call) ?: return\n        val address = call.getString("address")?.trim()\n')
          k.write_text(t)

          w=Path('.github/workflows/build-sbb-pos-android.yml')
          x=w.read_text()
          x=x.replace('<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />','<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />')
          x=x.replace("grep -q 'BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml", "grep -q 'BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml\n          grep -q 'BLUETOOTH_SCAN' android/app/src/main/AndroidManifest.xml")
          w.write_text(x)
          PY
          git diff --check

      - run: npm ci
      - name: Verify production build
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build

      - name: Commit launch patch
        run: |
          git config user.name "SBB Launch Bot"
          git config user.email "actions@smashbrosburgers.com"
          git add client/src/pages/pos/PosRegister.tsx native/android/ThermalPrinterPlugin.kt .github/workflows/build-sbb-pos-android.yml
          git commit -m "Fix POS launch checkout and Bluetooth blockers"
          git push origin HEAD:main

      - name: Build fixed Android APK
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('capacitor.config.json', JSON.stringify({appId:'io.customli.sbbpos',appName:'Smash Brothers POS',webDir:'dist/public',server:{url:'https://app.smashbrosburgers.com',cleartext:false,androidScheme:'https'},android:{allowMixedContent:false}},null,2));
          NODE
          rm -rf android
          npx cap add android
          APP_DIR="android/app/src/main/java/io/customli/sbbpos"
          mkdir -p "$APP_DIR"
          cp native/android/MainActivity.kt "$APP_DIR/MainActivity.kt"
          cp native/android/ThermalPrinterPlugin.kt "$APP_DIR/ThermalPrinterPlugin.kt"
          python3 <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); marker=s.find('>')+1
          perms='''\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n'''
          p.write_text(s[:marker]+perms+s[marker:])
          PY
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Smash-Brothers-POS-Launch-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
