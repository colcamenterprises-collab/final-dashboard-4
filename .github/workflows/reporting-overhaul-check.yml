name: Reporting Overhaul Check

on:
  pull_request:
    paths:
      - 'client/src/pages/reports/**'
      - 'client/src/components/reports/**'
      - 'server/reporting/**'
      - 'server/routes/reportingUnified.ts'
      - 'server/routes/receiptAnalytics.ts'
      - 'server/migrations/20260810*.sql'
      - 'server/scripts/import_reporting_history.ts'
      - 'client/src/App.tsx'
      - 'client/src/components/navigation/ModernSidebar.tsx'
      - '.github/workflows/reporting-overhaul-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check changed reporting files
        shell: bash
        run: |
          set +e
          npm run check -- --pretty false 2>&1 | tee /tmp/tsc.log
          TSC_STATUS=${PIPESTATUS[0]}
          set -e

          CHANGED_ERROR=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --diff-filter=ACMR --name-only               "origin/${{ github.base_ref }}...HEAD" |
              grep -E '\.(ts|tsx)$' > /tmp/changed-typescript-files.txt || true

            while IFS= read -r file; do
              if grep -F "${file}(" /tmp/tsc.log; then
                echo "::error file=${file}::TypeScript error detected in a changed file."
                CHANGED_ERROR=1
              fi
            done < /tmp/changed-typescript-files.txt
          fi

          if [ "$CHANGED_ERROR" -ne 0 ]; then
            exit 1
          fi
          if [ "$TSC_STATUS" -ne 0 ]; then
            echo '::warning::Repository has pre-existing TypeScript errors outside files changed by this pull request.'
          fi
      - name: Reporting regression tests
        shell: bash
        run: |
          TEST_FILES=(
            server/reporting/unifiedLedger.test.ts
            server/reporting/importers/loyverse.test.ts
          )
          if [ -f server/reporting/unifiedLabor.test.ts ]; then
            TEST_FILES+=(server/reporting/unifiedLabor.test.ts)
          fi
          npx tsx --test "${TEST_FILES[@]}"
      - name: Production build
        run: npm run build
