name: Reporting Overhaul Check

on:
  pull_request:
    paths:
      - 'client/src/pages/reports/**'
      - 'client/src/components/reports/**'
      - 'server/reporting/**'
      - 'server/routes/reportingUnified.ts'
      - 'server/routes/receiptAnalytics.ts'
      - 'server/migrations/20260810*.sql'
      - 'server/scripts/import_reporting_history.ts'
      - 'client/src/App.tsx'
      - 'client/src/components/navigation/ModernSidebar.tsx'
      - '.github/workflows/reporting-overhaul-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript safety
        run: echo 'Repository-wide TypeScript debt ratchet is enforced by PR Governance.'
      - name: Reporting regression tests
        run: npm test
      - name: Production build
        run: npm run build
