name: Apply dashboard small fixes

on:
  push:
    paths:
      - '.maintenance/apply-dashboard-small-fixes.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply profile and staff-delete fixes
        shell: bash
        run: |
          set -euo pipefail

          cat > client/src/pages/settings/Profile.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import { KeyRound, Save, UserRound } from "lucide-react";
          import StaffAvatarUpload from "@/components/staff/StaffAvatarUpload";

          type ProfileData = {
            id: number;
            name: string;
            username: string | null;
            email: string | null;
            contactNumber: string | null;
            role: string;
            avatarUrl: string | null;
            createdAt?: string | null;
          };

          async function api(path: string, options: RequestInit = {}) {
            const response = await fetch(path, {
              credentials: "include",
              headers: { "Content-Type": "application/json", ...(options.headers || {}) },
              ...options,
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || "Request failed");
            return body;
          }

          export default function Profile() {
            const [profile, setProfile] = useState<ProfileData | null>(null);
            const [form, setForm] = useState({ name: "", username: "", email: "", contactNumber: "" });
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState("");
            const [error, setError] = useState("");
            const [currentPin, setCurrentPin] = useState("");
            const [newPin, setNewPin] = useState("");

            const load = async () => {
              setLoading(true);
              setError("");
              try {
                const data = await api("/api/pin-auth/me/profile");
                setProfile(data.user);
                setForm({
                  name: data.user.name || "",
                  username: data.user.username || "",
                  email: data.user.email || "",
                  contactNumber: data.user.contactNumber || "",
                });
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : "Could not load profile");
              } finally {
                setLoading(false);
              }
            };

            useEffect(() => { void load(); }, []);

            const saveProfile = async () => {
              setSaving(true); setMessage(""); setError("");
              try {
                const data = await api("/api/pin-auth/me/profile", {
                  method: "PATCH",
                  body: JSON.stringify(form),
                });
                setProfile((prev) => prev ? { ...prev, ...data.user } : data.user);
                setMessage("Profile updated. Name changes appear everywhere after your next sign in.");
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : "Could not update profile");
              } finally { setSaving(false); }
            };

            const saveAvatar = async (avatarUrl: string | null) => {
              const data = await api("/api/pin-auth/me/profile", {
                method: "PATCH",
                body: JSON.stringify({ avatarUrl }),
              });
              setProfile((prev) => prev ? { ...prev, avatarUrl: data.user.avatarUrl ?? null } : prev);
              setMessage(avatarUrl ? "Profile photo updated" : "Profile photo removed");
            };

            const changePin = async () => {
              setMessage(""); setError("");
              try {
                await api("/api/pin-auth/me/pin", {
                  method: "PATCH",
                  body: JSON.stringify({ currentPin, newPin }),
                });
                setCurrentPin(""); setNewPin("");
                setMessage("Password / PIN updated");
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : "Could not update password / PIN");
              }
            };

            if (loading) return <div className="mx-auto max-w-4xl p-6 text-sm text-slate-500">Loading profile…</div>;
            if (!profile) return <div className="mx-auto max-w-4xl p-6 text-red-600">{error || "Profile unavailable"}</div>;

            return (
              <div className="mx-auto max-w-4xl space-y-6 p-2 md:p-6">
                <div>
                  <div className="flex items-center gap-3"><UserRound className="h-7 w-7" /><h1 className="text-3xl font-black">My Profile</h1></div>
                  <p className="mt-1 text-sm text-slate-500">Manage your own dashboard account details, profile photo and password / PIN.</p>
                </div>

                {(message || error) && <div className={`rounded-xl border px-4 py-3 text-sm ${error ? "border-red-200 bg-red-50 text-red-700" : "border-emerald-200 bg-emerald-50 text-emerald-800"}`}>{error || message}</div>}

                <section className="rounded-2xl border bg-white p-5 shadow-sm">
                  <StaffAvatarUpload name={profile.name} avatarUrl={profile.avatarUrl} onChange={saveAvatar} />
                  <div className="mt-5 grid gap-4 md:grid-cols-2">
                    <label className="space-y-1"><span className="text-xs font-bold uppercase tracking-wide text-slate-500">Name</span><input className="w-full rounded-xl border p-3" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></label>
                    <label className="space-y-1"><span className="text-xs font-bold uppercase tracking-wide text-slate-500">Username</span><input className="w-full rounded-xl border p-3" value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} /></label>
                    <label className="space-y-1"><span className="text-xs font-bold uppercase tracking-wide text-slate-500">Email</span><input type="email" className="w-full rounded-xl border p-3" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></label>
                    <label className="space-y-1"><span className="text-xs font-bold uppercase tracking-wide text-slate-500">Contact number</span><input className="w-full rounded-xl border p-3" value={form.contactNumber} onChange={(e) => setForm({ ...form, contactNumber: e.target.value })} /></label>
                  </div>
                  <div className="mt-4 flex items-center justify-between gap-3"><span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold capitalize text-slate-600">{profile.role.replaceAll("_", " ")}</span><button disabled={saving || !form.name.trim()} onClick={() => void saveProfile()} className="flex items-center gap-2 rounded-xl bg-black px-4 py-3 text-sm font-bold text-white disabled:opacity-50"><Save className="h-4 w-4" />{saving ? "Saving…" : "Save profile"}</button></div>
                </section>

                <section className="rounded-2xl border bg-white p-5 shadow-sm">
                  <div className="flex items-center gap-2"><KeyRound className="h-5 w-5" /><h2 className="text-lg font-black">Change password / PIN</h2></div>
                  <div className="mt-4 grid gap-3 md:grid-cols-2">
                    <input type="password" autoComplete="current-password" className="rounded-xl border p-3" placeholder="Current password / PIN" value={currentPin} onChange={(e) => setCurrentPin(e.target.value)} />
                    <input type="password" autoComplete="new-password" className="rounded-xl border p-3" placeholder="New password / PIN" value={newPin} onChange={(e) => setNewPin(e.target.value)} />
                  </div>
                  <div className="mt-4 flex justify-end"><button disabled={currentPin.length < 4 || newPin.length < 4} onClick={() => void changePin()} className="rounded-xl border border-black px-4 py-3 text-sm font-bold disabled:opacity-40">Update password / PIN</button></div>
                </section>
              </div>
            );
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          app = Path('client/src/App.tsx')
          s = app.read_text()
          if 'import Profile from "./pages/settings/Profile";' not in s:
              s = s.replace('import StaffAccess from "./pages/settings/StaffAccess";', 'import StaffAccess from "./pages/settings/StaffAccess";\nimport Profile from "./pages/settings/Profile";')
          route = '                    <Route path="/settings/profile" element={<ProtectedRoute><Profile /></ProtectedRoute>} />\n'
          if 'path="/settings/profile"' not in s:
              s = s.replace('                    <Route path="/settings/staff-access" element={<ProtectedRoute><OwnerRoute><StaffAccess /></OwnerRoute></ProtectedRoute>} />\n', route + '                    <Route path="/settings/staff-access" element={<ProtectedRoute><OwnerRoute><StaffAccess /></OwnerRoute></ProtectedRoute>} />\n')
          app.write_text(s)

          p = Path('server/routes/pinAuth.ts')
          s = p.read_text()

          old_get = '''        id: internalUsers.id,\n        name: internalUsers.name,\n        role: internalUsers.role,\n        active: internalUsers.active,\n        permissions: internalUsers.permissions,\n        avatarUrl: internalUsers.avatarUrl,\n        createdAt: internalUsers.createdAt,'''
          new_get = '''        id: internalUsers.id,\n        name: internalUsers.name,\n        username: internalUsers.username,\n        email: internalUsers.email,\n        contactNumber: internalUsers.contactNumber,\n        role: internalUsers.role,\n        active: internalUsers.active,\n        permissions: internalUsers.permissions,\n        avatarUrl: internalUsers.avatarUrl,\n        createdAt: internalUsers.createdAt,'''
          if old_get in s:
              s = s.replace(old_get, new_get, 1)

          old_patch = '''// ─── PATCH /me/profile — update own avatar ───────────────────────────────────\n\nrouter.patch("/me/profile", async (req: Request, res: Response) => {\n  const sessionUser = getPinSessionUser(req);\n  if (!sessionUser && process.env.NODE_ENV !== "development") {\n    return res.status(401).json({ error: "Not authenticated" });\n  }\n  const userId = sessionUser?.id ?? 1;\n  const { avatarUrl } = req.body as { avatarUrl?: string | null };\n  try {\n    const [updated] = await db\n      .update(internalUsers)\n      .set({ avatarUrl: avatarUrl ?? null })\n      .where(eq(internalUsers.id, userId))\n      .returning({ id: internalUsers.id, name: internalUsers.name, avatarUrl: internalUsers.avatarUrl });\n    if (!updated) return res.status(404).json({ error: "User not found" });\n    res.json({ ok: true, user: updated });\n  } catch {\n    res.status(500).json({ error: "Failed to update profile" });\n  }\n});'''
          new_patch = '''// ─── PATCH /me/profile — update own profile ──────────────────────────────────\n\nrouter.patch("/me/profile", async (req: Request, res: Response) => {\n  const sessionUser = getPinSessionUser(req);\n  if (!sessionUser && process.env.NODE_ENV !== "development") {\n    return res.status(401).json({ error: "Not authenticated" });\n  }\n  const userId = sessionUser?.id ?? 1;\n  const { name, username, email, contactNumber, avatarUrl } = req.body as {\n    name?: string; username?: string; email?: string; contactNumber?: string; avatarUrl?: string | null;\n  };\n  try {\n    const updates: Partial<typeof internalUsers.$inferInsert> = {};\n    if (name !== undefined) {\n      const cleanName = String(name).trim();\n      if (!cleanName) return res.status(400).json({ error: "Name is required" });\n      updates.name = cleanName;\n    }\n    if (username !== undefined) {\n      const base = String(username).trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");\n      if (!base) return res.status(400).json({ error: "Username is required" });\n      updates.username = await uniqueUsername(base, userId);\n    }\n    if (email !== undefined) updates.email = String(email).trim().toLowerCase() || null;\n    if (contactNumber !== undefined) updates.contactNumber = String(contactNumber).trim() || null;\n    if (avatarUrl !== undefined) updates.avatarUrl = avatarUrl;\n\n    const [updated] = await db\n      .update(internalUsers)\n      .set(updates)\n      .where(eq(internalUsers.id, userId))\n      .returning({\n        id: internalUsers.id, name: internalUsers.name, username: internalUsers.username,\n        email: internalUsers.email, contactNumber: internalUsers.contactNumber,\n        role: internalUsers.role, avatarUrl: internalUsers.avatarUrl, createdAt: internalUsers.createdAt,\n      });\n    if (!updated) return res.status(404).json({ error: "User not found" });\n    res.json({ ok: true, user: updated });\n  } catch (err) {\n    console.error("[pinAuth] PATCH /me/profile error:", err);\n    res.status(500).json({ error: "Failed to update profile" });\n  }\n});'''
          if old_patch not in s:
              raise SystemExit('Expected /me/profile patch block not found')
          s = s.replace(old_patch, new_patch, 1)

          anchor = '''// ─── PATCH /staff/:id/pin — reset a staff PIN (owner only) ──────────────────'''
          delete_route = '''// ─── DELETE /staff/:id — permanently remove staff login (owner only) ─────────\n\nrouter.delete("/staff/:id", async (req: Request, res: Response) => {\n  if (!requireOwner(req, res)) return;\n  const id = Number(req.params.id);\n  if (!Number.isFinite(id)) return res.status(400).json({ error: "Invalid user id" });\n\n  const sessionUser = getPinSessionUser(req);\n  if (sessionUser?.id === id) {\n    return res.status(409).json({ error: "You cannot permanently delete the account you are currently signed in with" });\n  }\n\n  try {\n    const [target] = await db\n      .select({ id: internalUsers.id, role: internalUsers.role, active: internalUsers.active })\n      .from(internalUsers)\n      .where(eq(internalUsers.id, id))\n      .limit(1);\n    if (!target) return res.status(404).json({ error: "User not found" });\n\n    if (target.role === "owner" && target.active) {\n      const owners = await db.select({ id: internalUsers.id, role: internalUsers.role, active: internalUsers.active }).from(internalUsers);\n      const activeOwnerCount = owners.filter((user) => user.role === "owner" && user.active).length;\n      if (activeOwnerCount <= 1) {\n        return res.status(409).json({ error: "The final active owner account cannot be deleted" });\n      }\n    }\n\n    const [deleted] = await db.delete(internalUsers).where(eq(internalUsers.id, id)).returning({ id: internalUsers.id });\n    if (!deleted) return res.status(404).json({ error: "User not found" });\n    res.json({ ok: true, deletedId: deleted.id });\n  } catch (err) {\n    console.error("[pinAuth] DELETE /staff/:id error:", err);\n    res.status(500).json({ error: "Failed to delete user" });\n  }\n});\n\n'''
          if 'router.delete("/staff/:id"' not in s:
              if anchor not in s:
                  raise SystemExit('Staff PIN route anchor not found')
              s = s.replace(anchor, delete_route + anchor, 1)
          p.write_text(s)
          PY

          npm ci
          NODE_OPTIONS=--max-old-space-size=4096 npm run build

      - name: Commit fixes and request production deployment
        shell: bash
        run: |
          set -euo pipefail
          printf 'SBB production deployment request\nrequested_at=%s\nrequested_by=GitHub Actions\nref=main\nreason=Profile page, staff delete API, sidebar small fixes\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/sbb-production-request.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/App.tsx client/src/pages/settings/Profile.tsx server/routes/pinAuth.ts .deploy/sbb-production-request.txt
          git commit -m 'Fix profile page and staff deletion'
          git push origin main
