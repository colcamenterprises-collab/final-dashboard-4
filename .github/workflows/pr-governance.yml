name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy and migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce PR policy
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/ci/pr-policy.sh

  typescript-ratchet:
    name: TypeScript debt ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install head dependencies
        run: npm ci
      - name: Self-test ratchet logic
        run: node scripts/stabilisation/typescript-ratchet.mjs --self-test
      - name: Compare TypeScript debt with PR base
        env:
          TSC_RATCHET_BASE: origin/${{ github.base_ref }}
        run: node scripts/stabilisation/typescript-ratchet.mjs

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  workflow-syntax:
    name: Workflow formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Parse workflow YAML
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          if ((${#files[@]})); then
            npx --no-install prettier --check "${files[@]}"
          else
            echo "No workflow files changed."
          fi
