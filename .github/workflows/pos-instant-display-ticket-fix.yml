name: POS Instant Display Ticket Fix

on:
  push:
    paths:
      - '.deploy/pos-instant-display-ticket-request.txt'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply POS ticket fix
        run: node scripts/apply-pos-instant-ticket-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build

      - name: Commit fix
        run: |
          git config user.name "SBB Launch Bot"
          git config user.email "actions@smashbrosburgers.com"
          git add server/routes/pos.ts
          git commit -m "Make POS display tickets fast and collision-safe"
          git push origin HEAD:main
