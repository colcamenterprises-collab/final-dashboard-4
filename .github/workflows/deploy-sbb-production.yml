name: Deploy SBB Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
  push:
    branches:
      - main
    paths:
      - ".deploy/sbb-production-request.txt"

permissions:
  contents: read

concurrency:
  group: sbb-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger production
    runs-on: [self-hosted, linux, x64, sbb-production, hostinger]
    timeout-minutes: 20

    steps:
      - name: Deploy with health checks and automatic rollback
        shell: bash
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          APP_DIR: /opt/apps/sbb-app-production
          SERVICE: sbb-production
          LOCAL_HEALTH_URL: http://127.0.0.1:8081/
          LOCAL_MENU_URL: http://127.0.0.1:8081/api/ordering/menu
          PUBLIC_HEALTH_URL: https://app.smashbrosburgers.com/
          PUBLIC_ORDER_URL: https://app.smashbrosburgers.com/order
        run: |
          set -Eeuo pipefail

          cd "$APP_DIR"

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          TARGET_REF="${DEPLOY_REF:-main}"
          BACKUP_DIR="$APP_DIR/.deploy-backups/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUILD_DIR="$BACKUP_DIR/source"
          LIVE_DIST_BACKUP="$BACKUP_DIR/live-dist"
          DIST_SWAPPED=0
          DEPLOY_SUCCEEDED=0
          ROLLBACK_STARTED=0

          echo "Previous source SHA:      $PREVIOUS_SHA"
          echo "Requested deploy ref:     $TARGET_REF"
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

          mkdir -p "$BACKUP_DIR"
          printf '%s\n' "$PREVIOUS_SHA" > "$BACKUP_DIR/previous-sha.txt"

          wait_for_url() {
            local url="$1"
            local label="$2"
            local attempts="${3:-30}"
            local sleep_seconds="${4:-2}"

            for ((i=1; i<=attempts; i++)); do
              if curl --fail --silent --show-error --max-time 8 --output /dev/null "$url"; then
                echo "$label passed on attempt $i/$attempts: $url"
                return 0
              fi
              echo "$label waiting... attempt $i/$attempts"
              sleep "$sleep_seconds"
            done

            echo "$label FAILED: $url"
            return 1
          }

          restore_previous_release() {
            if [ "$ROLLBACK_STARTED" -eq 1 ]; then
              echo "Rollback already attempted; refusing recursive rollback."
              return 1
            fi
            ROLLBACK_STARTED=1

            echo
            echo "========================================"
            echo "ROLLBACK STARTED"
            echo "========================================"

            if [ "$DIST_SWAPPED" -eq 1 ]; then
              rm -rf "$APP_DIR/dist"
              if [ -d "$LIVE_DIST_BACKUP" ]; then
                mv "$LIVE_DIST_BACKUP" "$APP_DIR/dist"
              else
                echo "No pre-deploy dist backup is available."
                return 1
              fi
            fi

            sudo systemctl restart "$SERVICE"

            wait_for_url "$LOCAL_HEALTH_URL" "rollback local app health" 30 2
            wait_for_url "$LOCAL_MENU_URL" "rollback ordering API health" 30 2
            wait_for_url "$PUBLIC_HEALTH_URL" "rollback public app health" 30 2
            wait_for_url "$PUBLIC_ORDER_URL" "rollback public order page health" 30 2

            echo "Rollback health verification passed."
          }

          on_failure() {
            local exit_code=$?
            if [ "$DEPLOY_SUCCEEDED" -eq 1 ]; then
              exit "$exit_code"
            fi

            echo
            echo "Deployment failed with exit code $exit_code."
            restore_previous_release || {
              echo "CRITICAL: automatic rollback could not be verified."
              sudo systemctl status "$SERVICE" || true
              exit 99
            }

            echo "DEPLOYMENT FAILED — PRODUCTION ROLLED BACK SUCCESSFULLY"
            exit "$exit_code"
          }

          trap on_failure ERR

          echo
          echo "==> Fetch target metadata"
          git fetch --prune origin
          git fetch origin "$TARGET_REF"
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          echo "Target SHA: $TARGET_SHA"

          # This isolated-dist deployment deliberately reuses the production runtime's
          # existing node_modules and Prisma client. Refuse it if either contract changed.
          if git diff --name-only "$PREVIOUS_SHA" "$TARGET_SHA" | grep -Eq '(^|/)(package.json|package-lock.json|schema.prisma)$|^prisma/'; then
            echo "Dependency or Prisma schema changes detected. This release requires the production checkout ownership to be repaired by a host administrator before deployment."
            false
          fi

          echo
          echo "==> Build target in isolated runner-owned checkout"
          ORIGIN_URL="$(git remote get-url origin)"
          git clone --quiet "$ORIGIN_URL" "$BUILD_DIR"
          git -C "$BUILD_DIR" checkout --quiet --detach "$TARGET_SHA"
          if [ -f "$APP_DIR/.env" ]; then
            ln -s "$APP_DIR/.env" "$BUILD_DIR/.env"
          fi
          cd "$BUILD_DIR"
          npm ci --no-audit --no-fund
          NODE_OPTIONS=--max-old-space-size=4096 npm run build
          test -f "$BUILD_DIR/dist/index.js"
          test -f "$BUILD_DIR/dist/public/index.html"

          echo
          echo "==> Atomically replace compiled production release"
          cd "$APP_DIR"
          if [ -d "$APP_DIR/dist" ]; then
            mv "$APP_DIR/dist" "$LIVE_DIST_BACKUP"
          fi
          mv "$BUILD_DIR/dist" "$APP_DIR/dist"
          DIST_SWAPPED=1

          echo
          echo "==> Restart production"
          sudo systemctl restart "$SERVICE"

          echo
          echo "==> Verify service"
          sudo systemctl is-active "$SERVICE" >/dev/null

          wait_for_url "$LOCAL_HEALTH_URL" "local app health" 30 2
          wait_for_url "$LOCAL_MENU_URL" "ordering API health" 30 2
          wait_for_url "$PUBLIC_HEALTH_URL" "public app health" 30 2
          wait_for_url "$PUBLIC_ORDER_URL" "public order page health" 30 2

          printf '%s\n' "$TARGET_SHA" > "$BACKUP_DIR/deployed-sha.txt"
          DEPLOY_SUCCEEDED=1
          trap - ERR

          echo
          echo "========================================"
          echo "SBB PRODUCTION DEPLOYMENT PASS"
          echo "Source checkout SHA: $PREVIOUS_SHA"
          echo "Deployed dist SHA:   $TARGET_SHA"
          echo "Backup:              $BACKUP_DIR"
          echo "========================================"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SBB Production Deployment"
            echo
            echo "- Result: **${{ job.status }}**"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Requested ref: \`${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}\`"
            echo "- Runner: \`${{ runner.name }}\`"
            echo "- Server: \`$(hostname)\`"
          } >> "$GITHUB_STEP_SUMMARY"
